conky.config = {
    alignment = 'middle_right',
    gap_x = 20,
    minimum_width = 400,
    minimum_height = 600,

    -- Window settings
    own_window = true,
    own_window_type = 'override',  -- stays below apps, above wallpaper
    own_window_argb_visual = true,
    own_window_argb_value = 70,  -- transparency (0–255)

    double_buffer = true,
    update_interval = 1.0,
    use_xft = true,
    font = 'Iosevka Nerd Font 18',
};

conky.text = [[
Time: ${time %H:%M:%S}
CPU: ${cpu}%
RAM: ${mem}/${memmax}
]];

